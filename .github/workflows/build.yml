name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.4

      - name: Unzip project
        run: unzip -q FireSaver-project.zip

      - name: Build debug APK
        working-directory: FireSaver
        run: gradle assembleDebug

      - name: Rename APK
        run: cp FireSaver/app/build/outputs/apk/debug/app-debug.apk FireSaver.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FireSaver v${{ github.run_number }}
          files: FireSaver.apk
          make_latest: true
